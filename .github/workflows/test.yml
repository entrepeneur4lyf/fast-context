name: Test & Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run Clippy
      run: cargo clippy --all-targets --all-features -- -D warnings

    - name: Check Python bindings build
      run: cargo check --features python

    - name: Install Python package for tests
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e ".[dev]"

    - name: Run Python tests
      run: python -m pytest tests/python
    
    - name: Run Rust tests
      run: cargo test --verbose

    - name: Run Rust CLI tests
      run: cargo test --test cli_tests

    - name: Smoke test Rust CLI
      run: |
        cargo run --quiet --bin fast-context -- --format json analyze . > cli-analysis.json
        cargo run --quiet --bin fast-context -- --format json doctor > cli-doctor.json
        python - <<'PY'
        import json
        with open("cli-analysis.json", "r", encoding="utf-8") as fh:
            analysis = json.load(fh)
        with open("cli-doctor.json", "r", encoding="utf-8") as fh:
            doctor = json.load(fh)
        assert analysis["file_count"] > 0
        assert analysis["symbol_count"] > 0
        assert doctor["status"] in {"ok", "warning"}
        print("CLI smoke checks passed")
        PY
    
    - name: Build TypeScript types
      run: npm run generate-types
    
    - name: Build native module
      run: npm run build:debug
    
    - name: Test built module
      run: |
        node -e "
        try {
          const module = require('./fast-context.linux-x64-gnu.node');
          console.log('✅ Module loads successfully');
          
          const analyzer = new module.FastContextAnalyzer({
            projectRoot: process.cwd(),
            ignorePatterns: ['node_modules/**']
          });
          console.log('✅ Constructor works');
          console.log('Version:', module.getVersion());
          
          if (module.getSupportedLanguages) {
            const langs = module.getSupportedLanguages();
            console.log('✅ Languages:', langs.length);
          }
          
        } catch (e) {
          console.error('❌ Module test failed:', e);
          process.exit(1);
        }
        "
    
    - name: Run Node.js tests
      run: npm test

  build-release:
    name: Build Release
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies  
      run: npm install
    
    - name: Build release
      run: npm run build

    - name: Build Rust CLI binaries
      run: |
        cargo build --release --bin fast-context
        cargo build --release --bin fast-context-mcp --features mcp
    
    - name: Test release build
      run: |
        node -e "
        try {
          const module = require('./fast-context.linux-x64-gnu.node');
          const analyzer = new module.FastContextAnalyzer({
            projectRoot: process.cwd(),
            ignorePatterns: ['node_modules/**']
          });
          console.log('✅ Release build works');
          console.log('Version:', module.getVersion());
        } catch (e) {
          console.error('❌ Release build failed:', e);
          process.exit(1);
        }
        "

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Generate and check TypeScript types
      run: |
        npm run generate-types
        # Verify TypeScript definitions are valid
        npx tsc --noEmit --skipLibCheck index.d.ts
        echo "✅ TypeScript definitions are valid"

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm install
    
    - name: Run npm audit
      run: npm audit --audit-level moderate
    
    - name: Run Rust security audit
      uses: actions-rs/audit-check@v1
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
