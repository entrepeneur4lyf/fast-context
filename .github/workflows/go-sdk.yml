name: Go SDK CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'go-sdk/**'
      - '.github/workflows/go-sdk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'go-sdk/**'
      - '.github/workflows/go-sdk.yml'
  release:
    types: [ published ]

env:
  GO_VERSION: '1.21'
  RUST_VERSION: '1.75'
  WORKING_DIRECTORY: ./go-sdk

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.19', '1.20', '1.21']
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
        cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/go.sum
    
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        override: true
    
    - name: Install dependencies
      run: |
        go mod download
        cargo fetch
    
    - name: Run linter
      uses: golangci/golangci-lint-action@v3
      with:
        version: latest
        working-directory: ${{ env.WORKING_DIRECTORY }}
        skip-cache: true
    
    - name: Run unit tests (mock)
      run: go test -v ./... -short
    
    - name: Run unit tests with race detection
      run: go test -v ./... -race -short
    
    - name: Run integration tests
      run: go test -v ./... -run Integration
    
    - name: Generate coverage report
      run: |
        go test -v -coverprofile=coverage.out ./...
        go tool cover -html=coverage.out -o coverage.html
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ${{ env.WORKING_DIRECTORY }}/coverage.out
        fail_ci_if_error: false

  build:
    name: Build
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go-version: ['1.21']
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go-version }}
        cache: true
        cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/go.sum
    
    - name: Set up Rust (Linux/macOS)
      if: runner.os != 'Windows'
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        override: true
    
    - name: Set up Rust (Windows)
      if: runner.os == 'Windows'
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        override: true
        target: x86_64-pc-windows-gnu
    
    - name: Install dependencies
      run: |
        go mod download
        cargo fetch
    
    - name: Build Go package
      run: go build -v ./...
    
    - name: Build with CGO (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cargo build --release
        go build -tags rustlib -v ./...
    
    - name: Build CLI
      run: go build -v ./cmd/fast-context
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: build-${{ matrix.os }}-${{ matrix.go-version }}
        path: |
          ${{ env.WORKING_DIRECTORY }}/fast-context
          ${{ env.WORKING_DIRECTORY }}/fast-context.exe

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: test
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Run Gosec security scanner
      uses: securecodewarrior/github-action-add-sarif@v1
      with:
        sarif-file: 'gosec.sarif'
      continue-on-error: true
    
    - name: Generate SBOM
      uses: CycloneDX/gh-gomod-generate-sbom@v1
      with:
        version: v1
        output: sbom.json
    
    - name: Upload SBOM
      uses: actions/upload-artifact@v3
      with:
        name: sbom
        path: ${{ env.WORKING_DIRECTORY }}/sbom.json

  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: build
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/go.sum
    
    - name: Run benchmarks
      run: |
        go test -bench=. -benchmem ./...
        go test -bench=. -benchmem -cpuprofile=cpu.prof ./...
        go test -bench=. -benchmem -memprofile=mem.prof ./...
    
    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      with:
        name: benchmark-results
        path: |
          ${{ env.WORKING_DIRECTORY }}/*.prof
          ${{ env.WORKING_DIRECTORY }}/benchmark.txt

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build, security, benchmark]
    if: github.event_name == 'release' && github.event.action == 'published'
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/go.sum
    
    - name: Set up Rust
      uses: actions-rs/toolchain@v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        override: true
    
    - name: Install dependencies
      run: |
        go mod download
        cargo fetch
    
    - name: Build release binaries
      run: |
        # Build for different platforms
        GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o fast-context-linux-amd64 ./cmd/fast-context
        GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o fast-context-linux-arm64 ./cmd/fast-context
        GOOS=darwin GOARCH=amd64 go build -ldflags="-s -w" -o fast-context-darwin-amd64 ./cmd/fast-context
        GOOS=darwin GOARCH=arm64 go build -ldflags="-s -w" -o fast-context-darwin-arm64 ./cmd/fast-context
        GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o fast-context-windows-amd64.exe ./cmd/fast-context
    
    - name: Generate release notes
      run: |
        echo "# Go SDK Release ${{ github.event.release.tag_name }}" > release-notes.md
        echo "" >> release-notes.md
        echo "## Changes" >> release-notes.md
        git log --pretty=format:"- %s" ${{ github.event.release.target_commitish }}..HEAD >> release-notes.md
    
    - name: Upload release assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ${{ env.WORKING_DIRECTORY }}/fast-context-*
          ${{ env.WORKING_DIRECTORY }}/release-notes.md
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ${{ secrets.DOCKER_USERNAME }}/fast-context-go-sdk:latest
          ${{ secrets.DOCKER_USERNAME }}/fast-context-go-sdk:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: [build, security]
    
    defaults:
      run:
        working-directory: ${{ env.WORKING_DIRECTORY }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true
        cache-dependency-path: ${{ env.WORKING_DIRECTORY }}/go.sum
    
    - name: Validate Go modules
      run: |
        go mod tidy
        go mod verify
        git diff --exit-code go.mod go.sum
    
    - name: Validate formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi
    
    - name: Validate dependencies
      run: |
        go list -m all
        go list -json -m all | jq -r '.Path + "@" + .Version' | sort