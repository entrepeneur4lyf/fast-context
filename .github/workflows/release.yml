name: Release

on:
  push:
    tags:
      - 'v*'

env:
  DEBUG: napi:*
  APP_NAME: fast-context
  MACOSX_DEPLOYMENT_TARGET: '10.13'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ steps.get_version.outputs.VERSION }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          body: |
            ## Changes in ${{ steps.get_version.outputs.VERSION }}
            
            This release includes the following changes:
            - Cross-platform Node native assets
            - Rust CLI and MCP binaries for supported targets
            - Bug fixes and performance improvements
            
            ### Installation
            ```bash
            npm install fast-context@${{ steps.get_version.outputs.VERSION }}
            ```
            
            ### Supported Platforms
            - Windows (x64, ARM64)
            - macOS (x64, Apple Silicon)
            - Linux (x64, ARM64, ARMv7, musl variants)
            - FreeBSD

            Python wheels and the source distribution are published from the tag-driven
            Python workflow for the same version.

  build-and-release:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
            build: npm run build -- --target x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            build: npm run build -- --target aarch64-apple-darwin
          - host: windows-latest
            build: npm run build -- --target x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
          - host: windows-latest
            build: npm run build -- --target aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian
            build: npm run build -- --target x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: x86_64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine
            build: npm run build -- --target x86_64-unknown-linux-musl
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-aarch64
            build: npm run build -- --target aarch64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-musl
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-alpine-aarch64
            build: npm run build -- --target aarch64-unknown-linux-musl
          - host: ubuntu-latest
            target: armv7-unknown-linux-gnueabihf
            docker: ghcr.io/napi-rs/napi-rs/nodejs-rust:lts-debian-zig
            build: npm run build -- --target armv7-unknown-linux-gnueabihf
    name: Build release for ${{ matrix.settings.target }}
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        if: ${{ !matrix.settings.docker }}
        with:
          node-version: 18
          cache: npm
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.settings.docker }}
        with:
          toolchain: stable
          targets: ${{ matrix.settings.target }}
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            .cargo-cache
            target/
          key: ${{ matrix.settings.target }}-cargo-release-${{ matrix.settings.host }}
      - uses: goto-bus-stop/setup-zig@v2
        if: ${{ matrix.settings.target == 'armv7-unknown-linux-gnueabihf' }}
        with:
          version: 0.11.0
      - name: Install dependencies
        run: npm install
      - name: Build in docker
        uses: addnab/docker-run-action@v3
        if: ${{ matrix.settings.docker }}
        with:
          image: ${{ matrix.settings.docker }}
          options: '--user 0:0 -v ${{ github.workspace }}/.cargo-cache:/root/.cargo/registry/cache -v ${{ github.workspace }}/.cargo/registry/index:/root/.cargo/registry/index -v ${{ github.workspace }}:/build -w /build'
          run: ${{ matrix.settings.build }}
      - name: Build Rust binaries in docker
        uses: addnab/docker-run-action@v3
        if: ${{ matrix.settings.docker }}
        with:
          image: ${{ matrix.settings.docker }}
          options: '--user 0:0 -v ${{ github.workspace }}/.cargo-cache:/root/.cargo/registry/cache -v ${{ github.workspace }}/.cargo/registry/index:/root/.cargo/registry/index -v ${{ github.workspace }}:/build -w /build'
          run: |
            cargo build --release --target ${{ matrix.settings.target }} --bin fast-context --features cli
            cargo build --release --target ${{ matrix.settings.target }} --bin fast-context-mcp --features mcp
      - name: Build
        run: ${{ matrix.settings.build }}
        if: ${{ !matrix.settings.docker }}
        shell: bash
      - name: Build Rust binaries
        if: ${{ !matrix.settings.docker }}
        run: |
          cargo build --release --target ${{ matrix.settings.target }} --bin fast-context --features cli
          cargo build --release --target ${{ matrix.settings.target }} --bin fast-context-mcp --features mcp
        shell: bash
      - name: Package Rust binaries
        id: package_binaries
        env:
          TARGET: ${{ matrix.settings.target }}
        run: |
          import os
          import pathlib
          import tarfile
          import zipfile

          target = os.environ["TARGET"]
          root = pathlib.Path("target") / target / "release"
          windows = "windows" in target
          exe_suffix = ".exe" if windows else ""
          outputs = []

          for binary_name, output_key in (
              ("fast-context", "cli_asset"),
              ("fast-context-mcp", "mcp_asset"),
          ):
              source = root / f"{binary_name}{exe_suffix}"
              if windows:
                  archive = pathlib.Path(f"{binary_name}-{target}.zip")
                  with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as bundle:
                      bundle.write(source, arcname=source.name)
              else:
                  archive = pathlib.Path(f"{binary_name}-{target}.tar.gz")
                  with tarfile.open(archive, "w:gz") as bundle:
                      bundle.add(source, arcname=binary_name)
              outputs.append((output_key, archive.name))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              for key, value in outputs:
                  handle.write(f"{key}={value}\n")
        shell: python
      - name: Upload Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ env.APP_NAME }}.${{ matrix.settings.target }}.node
          asset_name: ${{ env.APP_NAME }}.${{ matrix.settings.target }}.node
          asset_content_type: application/octet-stream
      - name: Upload Rust CLI Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ steps.package_binaries.outputs.cli_asset }}
          asset_name: ${{ steps.package_binaries.outputs.cli_asset }}
          asset_content_type: application/octet-stream
      - name: Upload Rust MCP Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ steps.package_binaries.outputs.mcp_asset }}
          asset_name: ${{ steps.package_binaries.outputs.mcp_asset }}
          asset_content_type: application/octet-stream

  build-freebsd-release:
    needs: create-release
    runs-on: macos-13
    name: Build FreeBSD release
    steps:
      - uses: actions/checkout@v4
      - name: Build
        id: build
        uses: vmactions/freebsd-vm@v1
        env:
          DEBUG: napi:*
          RUSTUP_UNPACK_RAM: '26214400'
          RUSTUP_IO_THREADS: '1'
        with:
          envs: DEBUG RUSTUP_UNPACK_RAM RUSTUP_IO_THREADS
          usesh: true
          mem: 3000
          prepare: |
            pkg install -y -f curl node18 python311
            curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal --default-toolchain stable
            export PATH="/root/.cargo/bin:$PATH"
          run: |
            export PATH="/root/.cargo/bin:$PATH"
            npm install
            npm run build
            rm -rf node_modules
            rm -rf target
      - name: Upload FreeBSD Release Asset
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ needs.create-release.outputs.upload_url }}
          asset_path: ./${{ env.APP_NAME }}.freebsd-x64.node
          asset_name: ${{ env.APP_NAME }}.freebsd-x64.node
          asset_content_type: application/octet-stream

  publish-npm:
    needs: [create-release, build-and-release, build-freebsd-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'
      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
      - name: Install dependencies
        run: npm install
      - name: Download release assets
        run: |
          # Download all the built binaries from the release
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            | jq -r '.assets[] | select(.name | endswith(".node")) | .browser_download_url' \
            | xargs -I {} curl -L -O {}
      - name: Prepare npm packages
        run: npm run universal
      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" >> ~/.npmrc
          npm config set provenance true
          if [[ "${{ steps.get_version.outputs.VERSION }}" == *"beta"* ]]; then
            npm publish --access public --tag beta
          elif [[ "${{ steps.get_version.outputs.VERSION }}" == *"alpha"* ]]; then
            npm publish --access public --tag alpha
          else
            npm publish --access public
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-crate:
    needs: [build-and-release, build-freebsd-release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
