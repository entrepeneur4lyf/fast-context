[package]
name = "fast-context"
version = "0.1.0"
edition = "2021"
description = "Intelligent codebase analysis engine for coding assistants with graph-powered code comprehension"
license = "Apache-2.0"
authors = ["Shawn McAllister x.com/entrepeneur4lyf"]
repository = "https://github.com/entrepeneur4lyf/fast-context"
keywords = ["codebase-analysis", "tree-sitter", "code-intelligence", "graph", "ai-assistant"]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
nodejs = ["napi", "napi-derive"]
python = ["pyo3", "pyo3-async-runtimes/tokio-runtime"]
full = ["nodejs", "python"]
# Optional features for enhanced functionality
mcp = ["rmcp"]
performance = ["python"]
development = ["full", "mcp", "performance"]

[dependencies]
# Core NAPI bindings (optional for Node.js)
napi = { version = "2.16.0", default-features = false, features = ["napi4", "tokio_rt", "async"], optional = true }
napi-derive = { version = "2.16.0", optional = true }

# Graph domain dependencies
petgraph = "0.7.0"
indexmap = { version = ">=1.9, <3", features = ["rayon"] }
ahash = "0.8.12"
fixedbitset = "0.5.7"
hashbrown = { version = ">=0.13, <0.16", features = ["rayon"] }
num-traits = "0.2"
rand = "0.8"
rand_pcg = "0.3"
rayon = "1.10"
rustworkx-core = "0.16.0"

# Core domain dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
ts-rs = "12.0"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
num_cpus = "1.0"
sysinfo = "0.30"

# Analysis domain dependencies
regex = "1.10"

# Tree-sitter language parsers
tree-sitter = "0.25.3"
streaming-iterator = "0.1.9"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-java = "0.23"
tree-sitter-go = "0.23"
tree-sitter-c-sharp = "0.23"
tree-sitter-swift = "0.7"
tree-sitter-objc = "3.0"
tree-sitter-php = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-scala = "0.23"
tree-sitter-zig = "1.1"
tree-sitter-dart = "0.0.4"
tree-sitter-lua = "0.2"
tree-sitter-bash = "0.23"
tree-sitter-css = "0.23"
tree-sitter-html = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-md = "0.3"
tree-sitter-jsdoc = "0.23"
tree-sitter-regex = "0.24"
tree-sitter-cpp = "0.23.4"

# Fast-context specific dependencies
notify = "6.1"
walkdir = "2.5"
lru = "0.16.3"
dashmap = "5.5"
tokio = { version = "1.0", features = ["full"] }
sha2 = "0.10"
dirs = "6.0"
encoding_rs = "0.8"
rmcp = { version = "1.2.0", features = ["server", "transport-io", "client"], optional = true }
clap = { version = "4.5", features = ["derive"] }

# Python bindings (optional)
pyo3 = { version = "0.24.2", features = ["extension-module"], optional = true }
pyo3-async-runtimes = { version = "0.24.0", features = ["tokio-runtime"], optional = true }
globset = "0.4"

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }

[build-dependencies]
napi-build = "2.1.0"

# Development profiles
[profile.dev]
opt-level = 0
debug = true
lto = false

[profile.dev.package."*"]
opt-level = 1

# Release profiles
[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Profile optimized for WASM
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

# Profile optimized for size
[profile.size]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1

[[bench]]
name = "performance_benchmarks"
harness = false

[[test]]
name = "api_integration_tests"
path = "tests/rust/api_integration_tests.rs"

[[test]]
name = "error_handling_tests"
path = "tests/rust/error_handling_tests.rs"

[[test]]
name = "graph_bindings_tests"
path = "tests/rust/graph_bindings_tests.rs"

[[test]]
name = "integration_tests"
path = "tests/rust/integration_tests.rs"

[[test]]
name = "cli_tests"
path = "tests/rust/cli_tests.rs"

[[test]]
name = "nodejs_api_tests"
path = "tests/rust/nodejs_api_tests.rs"

[[test]]
name = "performance_tests"
path = "tests/rust/performance_tests.rs"

[[test]]
name = "symbol_extraction_tests"
path = "tests/rust/symbol_extraction_tests.rs"
