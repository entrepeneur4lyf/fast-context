# Fast-Context Go SDK Static Linking Configuration

[general]
# Project information
name = "fast-context-go-sdk"
version = "1.0.0"
description = "Intelligent codebase analysis engine with static linking support"

# Static linking configuration
[static_linking]
# Enable static linking by default
enabled = true

# Default build tags for static builds
build_tags = ["netgo", "osusergo", "static_build"]

# Static linking flags
ldflags = "-s -w -linkmode external -extldflags '-static'"

# CGO static linking flags
cgo_ldflags = "-Wl,-Bstatic -lstdc++ -lgcc_eh -lgcc -lpthread -lm -lrt -ldl"

# Platform-specific static linking configurations

# Linux AMD64
[static_linking.linux_amd64]
enabled = true
compiler = "x86_64-linux-gnu-gcc"
linker = "x86_64-linux-gnu-gcc"
build_tags = ["netgo", "osusergo", "static_build"]
ldflags = "-s -w -linkmode external -extldflags '-static'"
cgo_ldflags = "-Wl,-Bstatic -lstdc++ -lgcc_eh -lgcc -lpthread -lm -lrt -ldl"
rust_flags = "-C target-feature=+crt-static"
compression = true
strip_symbols = true

# Linux ARM64
[static_linking.linux_arm64]
enabled = true
compiler = "aarch64-linux-gnu-gcc"
linker = "aarch64-linux-gnu-gcc"
build_tags = ["netgo", "osusergo", "static_build"]
ldflags = "-s -w -linkmode external -extldflags '-static'"
cgo_ldflags = "-Wl,-Bstatic -lstdc++ -lgcc_eh -lgcc -lpthread -lm -lrt -ldl"
rust_flags = "-C target-feature=+crt-static"
compression = true
strip_symbols = true

# macOS AMD64 (limited static linking)
[static_linking.darwin_amd64]
enabled = false
compiler = "clang"
linker = "clang"
build_tags = ["netgo", "osusergo"]
ldflags = "-s -w"
cgo_ldflags = ""
rust_flags = ""
compression = true
strip_symbols = true
notes = "Full static linking not supported on macOS due to system framework dependencies"

# macOS ARM64 (limited static linking)
[static_linking.darwin_arm64]
enabled = false
compiler = "clang"
linker = "clang"
build_tags = ["netgo", "osusergo"]
ldflags = "-s -w"
cgo_ldflags = ""
rust_flags = ""
compression = true
strip_symbols = true
notes = "Full static linking not supported on macOS due to system framework dependencies"

# Windows AMD64
[static_linking.windows_amd64]
enabled = true
compiler = "x86_64-w64-mingw32-gcc"
linker = "x86_64-w64-mingw32-gcc"
build_tags = ["static_build"]
ldflags = "-s -w -linkmode external -extldflags '-static'"
cgo_ldflags = "-ladvapi32 -lkernel32 -luser32 -lws2_32 -lmsvcrt"
rust_flags = "-C target-feature=+crt-static"
compression = true
strip_symbols = true

# FreeBSD AMD64
[static_linking.freebsd_amd64]
enabled = true
compiler = "gcc"
linker = "gcc"
build_tags = ["netgo", "osusergo", "static_build"]
ldflags = "-s -w -linkmode external -extldflags '-static'"
cgo_ldflags = "-lpthread -lm -lrt"
rust_flags = ""
compression = true
strip_symbols = true

# Build configurations
[build]
# Default build configuration
default_mode = "release"

# Release build
[build.release]
build_tags = ["netgo", "osusergo", "static_build"]
ldflags = "-s -w -linkmode external -extldflags '-static'"
gcflags = ""
compress_debug = true
strip_symbols = true
upx_compress = true

# Debug build
[build.debug]
build_tags = ["netgo", "osusergo", "static_build", "debug"]
ldflags = ""
gcflags = "-N -l"
compress_debug = false
strip_symbols = false
upx_compress = false

# Race build
[build.race]
build_tags = ["netgo", "osusergo", "static_build", "race"]
ldflags = "-s -w -linkmode external -extldflags '-static'"
gcflags = ""
compress_debug = false
strip_symbols = false
upx_compress = false

# Test build
[build.test]
build_tags = ["netgo", "osusergo", "static_build", "test"]
ldflags = "-s -w"
gcflags = ""
compress_debug = false
strip_symbols = false
upx_compress = false

# Compression settings
[compression]
# UPX compression settings
upx_enabled = true
upx_level = "best"
upx_ultra_brute = true

# Compression thresholds
min_size_kb = 100
max_ratio = 0.7

# Supported file formats
supported_formats = ["executable", "library"]

# Symbol stripping settings
[strip_symbols]
enabled = true
keep_debug_info = false
keep_line_numbers = false
keep_source_info = false

# Platform-specific strip commands
strip_commands = """
linux_amd64 = "strip --strip-all"
linux_arm64 = "aarch64-linux-gnu-strip --strip-all"
darwin_amd64 = "strip -x"
darwin_arm64 = "strip -x"
windows_amd64 = "strip --strip-all"
freebsd_amd64 = "strip --strip-all"
"""

# Verification settings
[verification]
# Verify static linking
verify_static = true
verify_dependencies = true
verify_compatibility = true

# Allowed dynamic libraries (if any)
allowed_dynamic_libs = []

# Required static libraries
required_static_libs = [
    "libc",
    "libgcc",
    "libstdc++",
    "libpthread",
    "librt",
    "libm",
    "libdl"
]

# Cross-compilation settings
[cross_compilation]
# Enable cross-compilation for static builds
enabled = true

# Cross-compilation toolchains
toolchains = """
linux_amd64 = "x86_64-linux-gnu"
linux_arm64 = "aarch64-linux-gnu"
darwin_amd64 = ""
darwin_arm64 = ""
windows_amd64 = "x86_64-w64-mingw32"
freebsd_amd64 = ""
"""

# Docker cross-compilation images
docker_images = """
linux_amd64 = "golang:1.21-alpine"
linux_arm64 = "golang:1.21-alpine"
darwin_amd64 = "golang:1.21-alpine"
darwin_arm64 = "golang:1.21-alpine"
windows_amd64 = "golang:1.21-alpine"
freebsd_amd64 = "golang:1.21-alpine"
"""

# Packaging settings
[packaging]
# Package static binaries
enabled = true

# Package formats
formats = ["tar.gz", "zip"]

# Include files in packages
include_files = [
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "VERSION",
    "examples/"
]

# Exclude files from packages
exclude_files = [
    ".*",
    "*.go",
    "go.mod",
    "go.sum",
    "Makefile",
    "Dockerfile*",
    "scripts/",
    "testdata/",
    "*.test",
    "*.prof"
]

# Package metadata
[package_metadata]
author = "Fast-Context Team"
maintainer = "Fast-Context Team <team@fast-context.dev>"
homepage = "https://fast-context.dev"
repository = "https://github.com/fast-context/go-sdk"
license = "MIT"
license_file = "LICENSE"
description = "Fast-Context Go SDK - Intelligent codebase analysis engine (statically linked)"

# CI/CD integration
[ci_cd]
# Enable static builds in CI
enabled = true

# Static build matrix
matrix = [
    { os = "linux", arch = "amd64", static = true },
    { os = "linux", arch = "arm64", static = true },
    { os = "windows", arch = "amd64", static = true },
    { os = "freebsd", arch = "amd64", static = true }
]

# Static build verification commands
verify_commands = """
verify_static = "file {binary} | grep -q 'statically linked'"
verify_deps = "ldd {binary} 2>&1 | grep -q 'not a dynamic executable'"
verify_size = "[ $(stat -c%s {binary}) -lt $((50 * 1024 * 1024)) ]"  # < 50MB
"""

# Security settings
[security]
# Enable security hardening for static builds
enabled = true

# Security flags
security_flags = """
linux = "-fstack-protector-strong -D_FORTIFY_SOURCE=2 -fcf-protection=full"
darwin = "-fstack-protector-strong"
windows = ""
freebsd = "-fstack-protector-strong -D_FORTIFY_SOURCE=2"
"""

# Hardening options
hardening_flags = """
linux = "-Wformat -Wformat-security -fstack-protector-all"
darwin = "-Wformat -Wformat-security -fstack-protector-all"
windows = "-Wformat -Wformat-security"
freebsd = "-Wformat -Wformat-security -fstack-protector-all"
"""

# Performance settings
[performance]
# Performance optimization flags
optimization_flags = "-O2 -DNDEBUG"

# Memory settings
memory_limit = "1GB"
stack_size = "8MB"
heap_size = "512MB"

# Thread settings
thread_safe = true
parallel_build = true

# Environment variables
[environment]
# Required environment variables for static builds
required_vars = [
    "CGO_ENABLED",
    "GOOS",
    "GOARCH"
]

# Optional environment variables
optional_vars = [
    "CC",
    "CXX",
    "LDFLAGS",
    "RUSTFLAGS"
]

# Default values for environment variables
default_values = """
CGO_ENABLED = "1"
GOOS = "linux"
GOARCH = "amd64"
CC = "gcc"
CXX = "g++"
LDFLAGS = ""
RUSTFLAGS = ""
"""

# Troubleshooting
[troubleshooting]
# Common issues and solutions
common_issues = """
[issue]
description = "CGO linking errors"
solution = "Ensure cross-compilation toolchains are installed and CGO_ENABLED=1"
command = "sudo apt-get install gcc-x86_64-linux-gnu gcc-aarch64-linux-gnu"

[issue]
description = "Missing static libraries"
solution = "Install static development libraries"
command = "sudo apt-get install libc6-dev libc6-dev-i386"

[issue]
description = "UPX compression fails"
solution = "Install UPX or disable compression"
command = "sudo apt-get install upx"

[issue]
description = "Large binary size"
solution = "Enable compression and strip symbols"
command = "strip --strip-all binary && upx --best binary"
"""

# Debug settings
[debug]
# Enable debug symbols in static builds
enabled = false

# Debug flags
debug_flags = "-O0 -g -DDEBUG"

# Keep debug information
keep_debug_info = false
keep_line_numbers = false
keep_source_info = false

# Generate debug symbols file
generate_debug_file = false
debug_file_extension = ".debug"